PLG_TASK_REORDERMENUITEMS="Task - Reorder Menu Items"
PLG_TASK_REORDERMENUITEMS_XML_DESCRIPTION="Temporary: gives the translated main menus of the User Guide (mainmenu-de-de and so on) the order of the source main menu, with the items under User Guide / Explanations, Admin Pages References and the field types under Fields in alphabetical order in every language."

PLG_TASK_REORDERMENUITEMS_REORDER_TITLE="Reorder menu items: translated main menus"
PLG_TASK_REORDERMENUITEMS_REORDER_DESC="Puts the items of every translated main menu (mainmenu-xx-xx) in the order of the items of the main menu they are associated with. The children of User Guide / Explanations (Getting Started on top), of Admin Pages References (Help Screens on top) and the field types under Fields are put in alphabetical order of their own titles instead, and the list of field types in the Fields article in the same order. Dry run by default."

PLG_TASK_REORDERMENUITEMS_FIELD_DRY_RUN_LABEL="Dry run"
PLG_TASK_REORDERMENUITEMS_FIELD_DRY_RUN_DESC="Log the new order, without saving anything. Switch this off to reorder."
PLG_TASK_REORDERMENUITEMS_FIELD_SOURCE_MENU_LABEL="Sort the source menu too"
PLG_TASK_REORDERMENUITEMS_FIELD_SOURCE_MENU_DESC="Put the alphabetical groups of the main menu itself (English) in alphabetical order too. Its other items are never moved."
PLG_TASK_REORDERMENUITEMS_FIELD_AS_USER_LABEL="Record changes as"
PLG_TASK_REORDERMENUITEMS_FIELD_AS_USER_DESC="The user shown as 'Modified by' and in the version history of the articles whose list is reordered."

PLG_TASK_REORDERMENUITEMS_LOG_FAILED="Reordering menu items stopped: %s"
